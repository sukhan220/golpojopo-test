

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>গল্পজল্প - প্রিমিয়াম স্প্ল্যাশ</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;600;700&display=swap" rel="stylesheet">
    <style>
       :root {
            --gold-light: #dfbd69;
            --gold-mid: #926d15;
            --gold-dark: #5d4a1f;
            --bg-color: #0c0c0c; 
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-color);
            font-family: 'Hind Siliguri', sans-serif;
        }

        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-left: 20px; 
        }

        .logo-row-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        svg {
            width: 85px; 
            height: auto;
            overflow: visible;
        }

        #bookPath {
            fill: none;
            stroke-width: 10;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .text-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .brand-name, .tagline {
            margin: 0;
            color: var(--gold-light);
            display: inline-block;
        }

        .brand-name {
            font-size: 42px;
            font-weight: 700;
            line-height: 1.2;
        }

        .brand-name span, .tagline span {
            opacity: 0;
            display: inline-block;
            transform: translateY(8px);
            transition: all 0.4s ease-out;
        }

        .brand-name span.visible, .tagline span.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .tagline {
            font-size: 13px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 5px;
            font-weight: 300;
            margin-left: 5px; 
        }

        .loading-section {
            width: 180px;
            margin-top: 25px; 
            margin-left: 105px; 
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .loader-bar-bg {
            width: 100%;
            height: 2px;
            background: rgba(223, 189, 105, 0.1);
            border-radius: 4px;
        }

        .loader-bar-fill {
            width: 0%;
            height: 100%;
            background-color: var(--gold-light);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="logo-row-container">
            <svg viewBox="0 0 400 400">
                <defs>
                    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#dfbd69;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:var(--gold-light);stop-opacity:1" />
                    </linearGradient>
                </defs>
                <path id="bookPath" stroke="url(#goldGrad)" d="
                    M 50,230 
                    Q 55,230 65,230 
                    T 85,220 T 100,230 T 115,220 T 130,235 T 145,210 T 160,260
                    C 180,290 200,150 220,110
                    C 250,70 310,60 350,90
                    L 350,310
                    C 310,320 270,310 205,350
                    C 150,330 110,310 40,310
                    L 40,90
                    C 80,60 140,50 210,100
                " />
            </svg>

            <div class="text-group">
                <div id="brandName" class="brand-name">Golpo Jolpo</div>
                <div id="tagline" class="tagline">Read • Listen • Write</div>
            </div>
        </div>

        <div class="loading-section" id="loadingSection">
            <div class="loader-bar-bg">
                <div class="loader-bar-fill" id="loaderFill"></div>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            const path = document.getElementById('bookPath');
            const brandContainer = document.getElementById('brandName');
            const taglineContainer = document.getElementById('tagline');
            const loadingSection = document.getElementById('loadingSection');
            const loaderFill = document.getElementById('loaderFill');

            function splitToSpans(container) {
                const text = container.innerText;
                container.innerHTML = '';
                text.split('').forEach(char => {
                    const span = document.createElement('span');
                    span.innerText = char === ' ' ? '\u00A0' : char;
                    container.appendChild(span);
                });
                return container.querySelectorAll('span');
            }

            const brandSpans = splitToSpans(brandContainer);
            const taglineSpans = splitToSpans(taglineContainer);

            const length = path.getTotalLength();
            path.style.strokeDasharray = length;
            path.style.strokeDashoffset = length;

            // আইকন ড্রয়িং শুরু (টোটাল সময় ৪ সেকেন্ড)
            setTimeout(() => {
                path.style.transition = 'stroke-dashoffset 4s ease-in-out';
                path.style.strokeDashoffset = '0';
            }, 500);

            // আইকন অ্যানিমেশন ৭০% শেষ হলে (৪ সেকেন্ডের ৭০% = ২.৮ সেকেন্ড + ইনিশিয়াল ডিলে ০.৫ = ৩.৩ সেকেন্ড)
            // ঠিক এই সময়ে লেটার এবং লোডার অ্যানিমেশন শুরু হবে
            const triggerTime = 2500; 

            // ১. ব্র্যান্ড নেম এবং ট্যাগলাইন অ্যানিমেশন
            setTimeout(() => {
                brandSpans.forEach((span, index) => {
                    setTimeout(() => {
                        span.classList.add('visible');
                    }, 80 * index);
                });

                // ট্যাগলাইন ব্র্যান্ড নেমের সামান্য পরে শুরু হবে
                setTimeout(() => {
                    taglineSpans.forEach((span, index) => {
                        setTimeout(() => {
                            span.classList.add('visible');
                        }, 40 * index);
                    });
                }, 800);
            }, triggerTime);

            // ২. লোডার অ্যানিমেশন একই সময়ে (৭০% আইকন ড্র হওয়ার পর) শুরু হবে
            setTimeout(() => {
                loadingSection.style.opacity = '1';
                setTimeout(() => {
                    loaderFill.style.transition = `width 3000ms cubic-bezier(0.1, 0.5, 0.5, 1)`;
                    loaderFill.style.width = '100%';
                }, 300);
            }, triggerTime);
        };
    </script>
</body>
</html>
