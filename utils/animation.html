

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>গল্পজল্প - প্রিমিয়াম স্প্ল্যাশ</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-light: #dfbd69;
            --gold-mid: #926d15;
            --gold-dark: #5d4a1f;
            --bg-color: #0c0c0c; 
        }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-color);
            font-family: 'Hind Siliguri', sans-serif;
        }

        .container {
            width: 420px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        svg {
            width: 100%;
            height: auto;
            overflow: visible;
        }

        #bookPath {
            fill: none;
            stroke-width: 7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand-name {
            margin-top: -35px;
            font-size: 55px; 
            font-weight: 700;
            background: var(--gold-light);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            transition: opacity 1.5s ease-in;
            letter-spacing: 1px;
            position: relative;
            z-index: 10;
        }

        .tagline {
            font-size: 14px;
            color: var(--gold-light);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: -5px;
            opacity: 0;
            font-weight: 300;
            transition: opacity 1.2s ease-in;
        }

        /* লোডিং সেকশন একটু উপরে তোলা হয়েছে */
        .loading-section {
            margin-top: 35px; 
            width: 150px;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        .loader-bar-bg {
            width: 100%;
            height: 2px;
            background: rgba(223, 189, 105, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .loader-bar-fill {
            width: 0%;
            height: 100%;
            background-color: var(--gold-light);
            border-radius: 4px;
        }

        /* পার্সেন্টেজ টেক্সট স্টাইল */
        .loading-text {
            font-size: 12px;
            color: var(--gold-light);
            margin-top: 10px;
            letter-spacing: 2px;
            font-weight: 300;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="container" id="wrapper">
        <svg viewBox="0 0 400 400">
            <defs>
                <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:var(--gold-light);stop-opacity:1" />
                    <stop offset="50%" style="stop-color:var(--gold-light);stop-opacity:1" />
                    <stop offset="100%" style="stop-color:var(--gold-dark);stop-opacity:1" />
                </linearGradient>
            </defs>
            
            <path id="bookPath" stroke="url(#goldGrad)" d="
                M 50,230 
                Q 55,230 65,230 
                T 85,220 T 100,230 T 115,220 T 130,235 T 145,210 T 160,260
                C 180,290 200,150 220,110
                C 250,70 310,60 350,90
                L 350,310
                C 310,320 270,310 205,350
                C 150,330 110,310 40,310
                L 40,90
                C 80,60 140,50 210,100
            " />
        </svg>

        <div id="brandName" class="brand-name">Golpo Jolpo</div>
        <div id="tagline" class="tagline">Read • Listen • Write</div>

        <div class="loading-section" id="loadingSection">
            <div class="loader-bar-bg">
                <div class="loader-bar-fill" id="loaderFill"></div>
            </div>
            <div class="loading-text" id="percentText">0%</div>
        </div>
    </div>

    <script>
        window.onload = function() {
            const path = document.getElementById('bookPath');
            const text = document.getElementById('brandName');
            const tagline = document.getElementById('tagline');
            const loadingSection = document.getElementById('loadingSection');
            const loaderFill = document.getElementById('loaderFill');
            const percentText = document.getElementById('percentText');

            const length = path.getTotalLength();
            path.style.strokeDasharray = length;
            path.style.strokeDashoffset = length;

            // ১. লোগো ড্রয়িং
            setTimeout(() => {
                path.style.transition = 'stroke-dashoffset 3.5s ease-in-out';
                path.style.strokeDashoffset = '0';
            }, 400);

            // ২. ব্র্যান্ড নেম এবং ট্যাগলাইন
            setTimeout(() => {
                text.style.opacity = '1';
                setTimeout(() => {
                    tagline.style.opacity = '0.8';
                }, 500);
            }, 3500);

            // ৩. লোডার এবং পার্সেন্টেজ কাউন্টার
            setTimeout(() => {
                loadingSection.style.opacity = '1';
                
                let progress = 0;
                const duration = 2500; // ২.৫ সেকেন্ড
                const intervalTime = 25; // প্রতি ২৫ মিলি-সেকেন্ডে আপডেট হবে
                const increment = 100 / (duration / intervalTime);

                setTimeout(() => {
                    loaderFill.style.transition = `width ${duration}ms cubic-bezier(0.4, 0, 0.2, 1)`;
                    loaderFill.style.width = '100%';

                    // পার্সেন্টেজ আপডেট করার ফাংশন
                    const counter = setInterval(() => {
                        progress += increment;
                        if (progress >= 100) {
                            percentText.innerText = "100%";
                            clearInterval(counter);
                        } else {
                            percentText.innerText = Math.floor(progress) + "%";
                        }
                    }, intervalTime);
                }, 200);
            }, 4500);
        };
    </script>
</body>
</html>
